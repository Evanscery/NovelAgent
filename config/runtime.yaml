runner:
  timeout_seconds: 600
  max_retries: 3
  backoff_seconds: [4, 8, 12]
  max_concurrent: 5

workflow:
  maximal_recursive_calling_depth: 1
  max_calls_multiplier: 2  # max agent calls = max_calls_multiplier × node count
  max_tokens: 100000       # per-round token budget
  max_tool_calls: 50       # per-round tool-call budget
