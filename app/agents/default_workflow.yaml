# Built-in default workflow canvas — linear, no feedback.
# The director is a system agent and does NOT appear as a node in the
# workflow canvas. The runtime layer schedules the workflow agents below;
# the director orchestrates them via call_agent/await.
#
# This is a CanvasGraph (user-canvas format); parse_canvas_to_tree compiles
# it into an expanded WorkflowTree at runtime. Nodes with no incoming
# wires (recaller, scout) become the roots of the compiled tree.
#
# Graph:
#   recaller -> writer
#   scout -> writer
#   writer -> critic
#   critic -> maintainer
#
# recaller and scout both feed writer (writer depends on both — writer's
# dependency_ids will list both recaller and scout, one as parent_id and
# the other as a dependency). No feedback wires (repeat_count=1 everywhere).

nodes:
  - id: recaller
    agent_name: recaller
    description: 召回数据
    params: {}
  - id: scout
    agent_name: scout
    description: 提供灵感
    params: {}
  - id: writer
    agent_name: writer
    description: 文本生成
    params: {}
  - id: critic
    agent_name: critic
    description: 对抗式/批判式修改建议
    params: {}
  - id: maintainer
    agent_name: maintainer
    description: 更新/维护数据
    params: {}

wires:
  - from_node: recaller
    to_node: writer
    repeat_count: 1
  - from_node: scout
    to_node: writer
    repeat_count: 1
  - from_node: writer
    to_node: critic
    repeat_count: 1
  - from_node: critic
    to_node: maintainer
    repeat_count: 1
