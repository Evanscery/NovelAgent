name: scout
id: scout
# scout covers the brainstormer role — provides inspiration and divergent thinking
task: 提供灵感。基于大纲和创作笔记，发散思考可能的发展方向、冲突点、伏笔。
input: 大纲、创作笔记、当前状态
output: 灵感清单（发展方向、冲突点、伏笔候选）
permission:
  read: [outline, notes, state]
  write: []
model: standard
tools: [read, list_files, glob_files, grep_lines, read_lines]
head: null
tail: null
allow_recursive: true
